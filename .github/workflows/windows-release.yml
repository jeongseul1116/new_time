name: Build and verify Windows EXE

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Defender availability before building
        shell: powershell
        run: ./scripts/scan-windows-release.ps1 -PreflightOnly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check application syntax
        shell: bash
        run: |
          node --check app.js
          node --check floating-window.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check reverse-tracking.js
      - name: Test reverse tracking state
        run: npm test
      - run: npm run dist:win
      - name: Scan with Microsoft Defender
        shell: powershell
        run: ./scripts/scan-windows-release.ps1
      - name: Generate file checksums
        run: node scripts/release-checksums.mjs
      - name: Attest executable build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*.exe
      - name: Save provenance bundle
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE_PATH release/build-provenance.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-release
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/Defender-scan.json
            release/build-provenance.jsonl
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-windows-release
          path: release
      - name: Verify downloaded release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash scripts/publish-release.sh
